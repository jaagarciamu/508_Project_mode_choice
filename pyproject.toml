[project]
name = "mode-choice-bogota"
version = "0.1.0"
description = "Reproducible EM2023 observed travel demand and mode choice research for Bogota."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.4,<5",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
source-docs = [
    "openpyxl>=3.1,<4",
    "pypdf>=5,<7",
]
geospatial = [
    "pyshp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mode_choice"]

[tool.uv]
package = true

